[project]
name = "my-discord-bot"
version = "0.1.0"
description = "A personal discord bot project"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
run-bot = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["botcmd", "config"]
