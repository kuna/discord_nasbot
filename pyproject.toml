[project]
name = "my-discord-bot"
version = "0.1.0"
description = "A personal discord bot project"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.15.0",
    "croniter>=6.2.4",
    "discord.py>=2.3.0",
    "dukpy>=0.6.0",
    "lxml>=6.1.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
run-bot = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# "plugins*" also picks up plugins_priv/ when it exists
testpaths = ["tests", "plugins*"]
pythonpath = ["."]
asyncio_mode = "auto"
# importlib mode lets every plugin have its own test_handler.py without name collisions
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["botcmd", "config"]
